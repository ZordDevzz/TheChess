name: Báo cáo sự cố (Bug Report)
description: Báo cáo lỗi hoặc hành vi không mong muốn trong TheChess.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo cáo sự cố để nâng cao chất lượng TheChess. Vui lòng cung cấp chi tiết theo các mục dưới đây.

  - type: textarea
    id: description
    attributes:
      label: Mô tả sự cố
      description: Tóm tắt rõ ràng và súc tích về lỗi gặp phải.
      placeholder: Mô tả hiện tượng xảy ra...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Các bước tái hiện
      description: Các bước cụ thể để tái hiện lại lỗi này.
      placeholder: |
        1. Mở trang...
        2. Nhập nước đi hoặc FEN...
        3. Nhấn nút...
        4. Quan sát lỗi...
    validations:
      required: true

  - type: input
    id: fen-pgn
    attributes:
      label: Chuỗi FEN hoặc PGN liên quan (nếu có)
      description: Chuỗi thế cờ FEN hoặc biên bản PGN tại thời điểm phát sinh lỗi.
      placeholder: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Hành vi kỳ vọng
      description: Điều gì đáng lẽ phải diễn ra theo chuẩn thiết kế?
      placeholder: Mô tả hành vi đúng kỳ vọng...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Môi trường hoạt động
      description: Thông tin về hệ điều hành, trình duyệt, phiên bản Python, Docker,...
      value: |
        - Hệ điều hành: [ví dụ: Ubuntu 24.04, macOS 14, Windows 11]
        - Trình duyệt: [ví dụ: Chrome 124, Firefox 125]
        - Phương thức chạy: [Docker Compose / Cục bộ]
        - Phiên bản TheChess: [ví dụ: master commit abcdef]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Nhật ký lỗi (Logs / Traces)
      description: Dán thông tin log từ terminal hoặc browser console nếu có.
      render: shell
    validations:
      required: false
