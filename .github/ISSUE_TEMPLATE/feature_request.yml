name: Đề xuất tính năng (Feature Request)
description: Đề xuất tính năng hoặc cải tiến mới cho TheChess.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Đề xuất ý tưởng mới giúp mở rộng chức năng hoặc tối ưu hóa trải nghiệm sử dụng TheChess.

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
      description: Vấn đề hay điểm bất tiện hiện tại thúc đẩy bạn đưa ra đề xuất này là gì?
      placeholder: Tôi nhận thấy rằng khi thực hiện...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Giải pháp đề xuất
      description: Mô tả chi tiết tính năng bạn muốn bổ sung và cách nó vận hành.
      placeholder: Tính năng sẽ cung cấp khả năng...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Các giải pháp thay thế đã cân nhắc
      description: Bạn đã cân nhắc phương án giải quyết nào khác chưa?
      placeholder: Một hướng tiếp cận khác có thể là...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Tài liệu tham khảo hoặc ngữ cảnh bổ sung
      description: Hình ảnh phác thảo, liên kết tài liệu kỹ thuật hoặc quy chuẩn cờ vua liên quan.
    validations:
      required: false
